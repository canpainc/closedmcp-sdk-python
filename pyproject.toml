[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "closedmcp"
version = "0.3.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
description = "ClosedMCP sign-in and hosted-app helpers for Python MCP servers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1,<2", "PyJWT[crypto]>=2.8,<3", "uvicorn>=0.30,<1", "starlette>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/canpainc/closedmcp-sdk-python"
Repository = "https://github.com/canpainc/closedmcp-sdk-python"

[project.optional-dependencies]
fastmcp = ["fastmcp>=2,<3"]
dev = ["fastmcp>=2,<3", "pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.6,<1"]
test = ["fastmcp>=2,<3", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
